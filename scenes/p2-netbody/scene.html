<!doctype html>
<html><head><meta charset="utf-8"><title>P2 · 蓝色网光体 loop</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../../core/runtime.js"></script>
<script>
// 效果库代号: body + net  | 用在 P2 第一层模板
// prompt: SDF raymarched neutral humanoid, voronoi F2-F1 surface net, glowing nodes,
//         fresnel rim glow, moving scanline, slow 360° turntable, seamless loop
const DUR = 12;
const c = document.getElementById('c');
const fit = () => { c.width = innerWidth; c.height = innerHeight; };
fit(); addEventListener('resize', fit);

const sh = Scene.shader(c, `
uniform float uScan;
mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float cap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float ell(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}

// 中性人体（无性别特征），站姿，双臂微张
float body(vec3 p){
  vec3 q=p; q.x=abs(q.x);
  float d = ell(p-vec3(0,1.62,0), vec3(.105,.13,.115));                 // head
  d = smin(d, cap(p,vec3(0,1.45,0),vec3(0,1.53,0),.05), .05);           // neck
  d = smin(d, ell(p-vec3(0,1.22,0), vec3(.19,.25,.12)), .08);           // chest
  d = smin(d, ell(p-vec3(0,0.95,0), vec3(.15,.16,.10)), .1);            // waist
  d = smin(d, ell(p-vec3(0,0.80,0), vec3(.18,.13,.11)), .08);           // hips
  d = smin(d, cap(q,vec3(.19,1.38,0),vec3(.27,1.08,.0),.05), .06);      // upper arm
  d = smin(d, cap(q,vec3(.27,1.08,0),vec3(.33,.80,.04),.04), .03);      // forearm
  d = smin(d, ell(q-vec3(.345,.72,.05), vec3(.035,.06,.02)), .03);      // hand
  d = smin(d, cap(q,vec3(.09,.78,0),vec3(.11,.42,.01),.07), .06);       // thigh
  d = smin(d, cap(q,vec3(.11,.42,.01),vec3(.12,.06,-.01),.05), .03);    // shin
  d = smin(d, ell(q-vec3(.12,.025,.05), vec3(.045,.03,.1)), .03);       // foot
  return d;
}
vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453);}
// voronoi F2-F1 → 网线；F1 → 节点
vec2 voro(vec3 x){
  vec3 i=floor(x),f=fract(x); float d1=8.,d2=8.;
  for(int k=-1;k<=1;k++)for(int j=-1;j<=1;j++)for(int n=-1;n<=1;n++){
    vec3 g=vec3(n,j,k); vec3 o=hash3(i+g); vec3 r=g+o-f; float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;}else if(d<d2){d2=d;}
  }
  return vec2(sqrt(d1),sqrt(d2)-sqrt(d1));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  float ang=uLoop*TAU;
  vec3 ro=vec3(0,.88,3.5), rd=normalize(vec3(uv,-1.8));
  float t=0., glow=0., hit=-1.;
  for(int i=0;i<72;i++){
    vec3 p=ro+rd*t; p.xz=rot(ang)*p.xz;
    float d=body(p);
    glow+=.012/(.02+d*d*40.);
    if(d<.002){hit=t;break;}
    t+=d*.9; if(t>6.)break;
  }
  vec3 bg=vec3(.004,.008,.02)+vec3(.0,.02,.06)*(1.-length(uv));
  vec3 col=bg + vec3(.05,.25,.9)*glow*.05;
  if(hit>0.){
    vec3 p=ro+rd*hit; vec3 pl=p; pl.xz=rot(ang)*pl.xz;
    vec2 e=vec2(.002,0);
    vec3 n=normalize(vec3(body(pl+e.xyy)-body(pl-e.xyy),body(pl+e.yxy)-body(pl-e.yxy),body(pl+e.yyx)-body(pl-e.yyx)));
    vec3 nv=n; nv.xz=rot(-ang)*nv.xz;
    float fr=pow(1.-max(dot(nv,-rd),0.),2.5);
    vec2 v=voro(pl*26.);
    vec2 v2=voro(pl*70.+3.1);
    float line=smoothstep(.05,.0,v.y)+.35*smoothstep(.06,.0,v2.y);
    float node=smoothstep(.09,.0,v.x);
    float pulse=.5+.5*sin(TAU*(uLoop*3.)-pl.y*6.);              // 沿身体上行的脉冲（3 次/循环，可无缝）
    float scan=exp(-pow((pl.y-uScan)*14.,2.));
    vec3 blue=vec3(.12,.45,1.), cyan=vec3(.5,.9,1.);
    col = vec3(.005,.02,.06)*(1.-fr);
    col += blue*line*(.35+.65*pulse);
    col += cyan*node*1.4*(.6+.4*pulse);
    col += blue*fr*1.2 + cyan*scan*(.4+line);
  }
  col = 1.-exp(-col*1.6);                // tonemap
  col = pow(col, vec3(.95));
  fragColor=vec4(col,1.);
}`);

Scene.define({
  duration: DUR, fps: 30,
  draw(t) {
    const k = (t % DUR) / DUR;
    // 扫描线：每循环从脚到头两次
    const scan = -0.1 + 1.9 * ((k * 2) % 1);
    sh.draw(t, k, { uScan: scan });
  }
});
</script></body></html>
