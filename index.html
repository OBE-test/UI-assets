<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awakenology 素材库</title>
<style>
:root{--bg:#07090f;--card:#10131c;--line:#1e2433;--tx:#e6e8ee;--mute:#8a93a6;--acc:#7fb4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Noto Sans CJK SC",sans-serif}
header{padding:28px 32px 8px}h1{margin:0;font-size:22px;font-weight:600}header p{margin:4px 0 0;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 32px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.bar button,.bar input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.bar button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}.bar input{border-radius:8px;min-width:220px;cursor:text}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px 32px 60px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}
.th{aspect-ratio:16/9;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.m{padding:10px 12px}.nm{display:flex;justify-content:space-between;gap:8px;font-weight:600}.id{color:var(--mute);font:12px ui-monospace,monospace}
.ds{color:var(--mute);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--mute)}
.tag.t{color:var(--acc);border-color:#2b3b5a}
</style></head><body>
<header><h1>Awakenology 素材库</h1><p>代码生成素材 · 网页可直接嵌入 · 视频用 <code>video/render.py</code> 逐帧渲染。需要本地 server：<code>python3 -m http.server</code></p></header>
<div class="bar" id="bar"><input id="q" placeholder="搜索名称 / 代号 / 提示词"></div>
<main id="grid"></main>
<script>
const TYPES={all:'全部',effect:'效果',scene:'视频场景',prototype:'网页原型',doc:'文档'};
fetch('catalog.json').then(r=>r.json()).then(cat=>{
  let type='all',q='';const bar=document.getElementById('bar'),grid=document.getElementById('grid');
  Object.entries(TYPES).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v;b.setAttribute('aria-pressed',k==='all');
    b.onclick=()=>{type=k;bar.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};bar.insertBefore(b,bar.lastElementChild)});
  document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();draw()};
  function draw(){grid.innerHTML='';cat.items.filter(it=>(type==='all'||it.type===type)&&(!q||JSON.stringify(it).toLowerCase().includes(q))).forEach(it=>{
    const a=document.createElement('a');a.className='card';a.href=it.path;a.target='_blank';
    a.innerHTML=`<div class="th" style="${it.thumb?`background-image:url('${it.thumb}')`:''}">${it.thumb?'':TYPES[it.type]}</div>
      <div class="m"><div class="nm"><span>${it.name}</span><span class="id">${it.type==='effect'?'#':''}${it.id}</span></div>
      <div class="ds">${it.use_note||it.prompt||''}</div>
      <div class="tags"><span class="tag t">${TYPES[it.type]}</span>${(it.used_in||[]).map(u=>`<span class="tag">${u==='bg'?'背景':u}</span>`).join('')}</div></div>`;
    grid.appendChild(a)})}
  draw();
});
</script></body></html>
