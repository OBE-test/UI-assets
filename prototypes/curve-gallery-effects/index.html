<style>
:root{
  /* full-bleed 3D canvas; chrome is small pills that flip with the light/dark scene */
  --bg:#f3f2ef;
  --text:#16181d;
  --muted:#6c7079;
  --pill:rgba(255,255,255,.78);
  --line:rgba(20,24,30,.12);
  --accent:#16181d;
  --f-ui:"JetBrains Mono","PingFang SC","Noto Sans SC",ui-monospace,monospace;
  color-scheme:light;
}
body.dark{--bg:#06070b;--text:#e9ecf1;--muted:#8d94a0;--pill:rgba(14,16,22,.72);--line:rgba(200,220,255,.14);--accent:#e9ecf1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:12.5px}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
.hd{position:fixed;top:16px;left:16px;pointer-events:none}
.hd h1{margin:0;font-size:14px;font-weight:500;letter-spacing:.03em}
.hd p{margin:4px 0 0;color:var(--muted)}
.pill{position:fixed;display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--pill)}
.pill button{font:inherit;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.pill button:hover{color:var(--text)}
.pill button[aria-pressed="true"]{color:var(--bg);background:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid #4c8dff;outline-offset:2px}
#paths{left:50%;bottom:16px;transform:translateX(-50%)}
#opts{right:16px;top:16px}
.focus{position:fixed;left:16px;bottom:16px;max-width:300px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pill);display:grid;gap:3px}
.focus .k{color:var(--muted);font-size:11px}
.focus .t{font-size:14px;font-weight:500}
.focus a{color:var(--text)}
@media (max-width:720px){#paths{left:16px;right:16px;transform:none;bottom:84px;justify-content:space-between}.focus{right:16px;max-width:none}}
</style>
</head>

const PRE=`precision highp float;uniform vec2 R;uniform float T;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
vec2 vor(vec2 x){vec2 i=floor(x),f=fract(x);float f1=8.,f2=8.;for(int y=-1;y<=1;y++)for(int k=-1;k<=1;k++){vec2 g=vec2(float(k),float(y));vec2 o=h2(i+g);o=.5+.4*sin(T*.6+6.2832*o);float d=length(g+o-f);if(d<f1){f2=f1;f1=d;}else if(d<f2)f2=d;}return vec2(f1,f2);}
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+1.),f.x),f.y),f.z);}
float f3(vec3 p){return .5*n3(p)+.25*n3(p*2.03)+.125*n3(p*4.01);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

{id:"body",cat:"form",nm:"SDF 光体人形",en:"SDF light body",ds:"符号距离场 + Fresnel 边缘光",use:["P2"],useTxt:"P2 网光体、各层光体的基础人形",

glsl:`float smin(float a,float b,float k){float hh=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,hh)-k*hh*(1.-hh);}
float cap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float hh=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*hh)-r;}
float map(vec3 p){p.xz=rot(T*.4)*p.xz;vec3 q=p;q.x=abs(q.x);
float d=length(p-vec3(0,.78,0))-.14;d=smin(d,cap(p,vec3(0,.55,0),vec3(0,.05,0),.16),.1);

{id:"gyr",cat:"form",nm:"Gyroid 极小曲面",en:"Gyroid TPMS lattice",ds:"三周期极小曲面晶格",use:["P2"],useTxt:"P2 网光体的内部骨架、能量晶格",

prompt:"gyroid triply periodic minimal surface shell clipped by sphere, raymarched, cyan diffuse, fresnel, distance glow",
glsl:`float map(vec3 p){p.xz=rot(T*.25)*p.xz;p.yz=rot(.4)*p.yz;float s=7.;float g=abs(dot(sin(p*s),cos(p.zxy*s)))/s-.025;return max(g*.6,length(p)-.95);}
void main(){${UV}vec3 ro=vec3(0,0,2.4),rd=normalize(vec3(uv,-1.6));float t=0.,md=9.;bool hit=false;

float df=max(dot(nn,normalize(vec3(.5,.7,.6))),0.),fr=pow(1.-abs(dot(nn,rd)),2.);col=mix(vec3(.05,.2,.5),vec3(.4,.85,1.),df)*(.4+.6*smoothstep(3.4,1.6,t))+vec3(.6,.9,1.)*fr*.6;}
gl_FragColor=vec4(col,1.);}`},
{id:"iri",cat:"optics",nm:"薄膜干涉虹彩",en:"Thin-film iridescence",ds:"肥皂泡、全息片的干涉色",use:["P2"],useTxt:"P2 高阶身的表面质感",

{id:"cau",cat:"optics",nm:"水波焦散",en:"Water caustics",ds:"折射光聚焦的光网",use:["P1","bg"],useTxt:"P1 展厅地面、水下氛围",

function GLR(canvas){

  const progs={};

    if(progs[fx.id]!==undefined)return progs[fx.id];
    const mk=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);return o};
    const pr=g.createProgram();g.attachShader(pr,mk(g.VERTEX_SHADER,VS));g.attachShader(pr,mk(g.FRAGMENT_SHADER,PRE+fx.glsl));g.linkProgram(pr);

    progs[fx.id]={pr,a:g.getAttribLocation(pr,'p'),R:g.getUniformLocation(pr,'R'),T:g.getUniformLocation(pr,'T')};
    return progs[fx.id];

  return {canvas,draw(fx,t){const p=get(fx);if(!p)return false;g.viewport(0,0,canvas.width,canvas.height);g.useProgram(p.pr);
    g.bindBuffer(g.ARRAY_BUFFER,buf);g.enableVertexAttribArray(p.a);g.vertexAttribPointer(p.a,2,g.FLOAT,false,0,0);

}

let dragY=null;const st=document.getElementById('stage');
st.addEventListener('pointerdown',e=>{dragY=e.clientY;st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(dragY===null||auto)return;nudge((dragY-e.clientY)*3);dragY=e.clientY});
st.addEventListener('pointerup',()=>{dragY=null});
addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){targetT+=.01}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){targetT-=.01}});
document.querySelectorAll('#paths button').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.p;if(i===cur)return;
  document.querySelectorAll('#paths button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  P.forEach(o=>o.from.copy(o.pos));camFrom.copy(camera.position);cur=i;placeOn(i,'to');morph=0;morphStart=performance.now()}));
document.getElementById('auto').addEventListener('click',e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto)});
document.getElementById('theme').addEventListener('click',e=>{const d=!document.body.classList.contains('dark');document.body.classList.toggle('dark',d);e.currentTarget.setAttribute('aria-pressed',d);
  const bg=d?'#06070b':'#f3f2ef';scene.background.set(bg);mat.uniforms.uFog.value.set(bg);mat.uniforms.uEdge.value.set(d?'#2a3140':'#ffffff')});
scene.background=new THREE.Color('#f3f2ef');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const M4=new THREE.Matrix4(),Q=new THREE.Quaternion(),S3=new THREE.Vector3();
const fName=document.getElementById('fName'),fMeta=document.getElementById('fMeta'),fLink=document.getElementById('fLink');
let lastFocus=-1,rr=0,last=performance.now();const t0=last;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const T=(now-t0)/1000;
  if(auto&&!reduce)targetT+=dt/40;
  camT+=(targetT-camT)*(1-Math.exp(-dt*4));
  const c=curves[cur],tt=((camT%1)+1)%1,cp=c.getPointAt(tt);
  if(morph<1){morph=Math.min(1,(now-morphStart)/1400);const e=ease(morph);P.forEach(o=>o.pos.lerpVectors(o.from,o.to,e));
    camera.position.lerpVectors(camFrom,new THREE.Vector3(cp.x,cp.y,cp.z+CAM_Z),e)}
  else camera.position.set(cp.x,cp.y,cp.z+CAM_Z);
  const gate=FOCUS*1.6/lens[cur];let best=-1,bs=0;
  for(let i=0;i<N;i++){const o=P[i];const dx=camera.position.x-o.pos.x,dy=camera.position.y-o.pos.y,dxy=Math.hypot(dx,dy);
    let d=Math.abs(o.t-tt);if(d>.5)d=1-d;
    let target=1;if(d<gate&&dxy<FOCUS){const k=1-dxy/FOCUS;target=1+(MAXS-1)*k*k*(3-2*k)}
    o.scale+=(target-o.scale)*(1-Math.exp(-dt*8));if(o.scale>bs){bs=o.scale;best=i}
    S3.setScalar(o.size*o.scale);M4.compose(o.pos,Q,S3);mesh.setMatrixAt(i,M4)}
  mesh.instanceMatrix.needsUpdate=true;
  const fi=best>=0&&bs>2?P[best].fx:-1;
  if(fi>=0)drawCell(cells[fi],T);
  for(let k=0;k<4;k++){rr=(rr+1)%cells.length;if(rr!==fi)drawCell(cells[rr],T)}
  tex.needsUpdate=true;
  if(fi!==lastFocus){lastFocus=fi;if(fi>=0){const fx=FX[fi];fName.textContent=fx.nm+'  #'+fx.id;fMeta.textContent=fx.ds+' · '+fx.useTxt;fLink.href=LIB_URL+'#'+fx.id}
    else{fName.textContent='—';fMeta.textContent='继续前进，靠近的作品会放大';fLink.href=LIB_URL}}
  renderer.render(scene,camera)}
requestAnimationFrame(loop);
</script>
</body>
</html>
