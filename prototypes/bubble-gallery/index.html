<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awakenology 泡泡画廊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* night sky of bubbles; chrome is faint glass pills, content cards float over foam */
  --bg:#05060a;
  --text:#e9edf3;
  --muted:#8a93a3;
  --glass:rgba(12,15,23,.78);
  --line:rgba(170,200,255,.16);
  --accent:#bfe3ff;
  --f-ui:"IBM Plex Sans","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:13px}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
#foam{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.hd{position:fixed;top:18px;left:20px;pointer-events:none}
.hd h1{margin:0;font-size:13px;font-weight:500;letter-spacing:.02em}
.hd p{margin:3px 0 0;color:var(--muted);font-size:12px}
.paths{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:6px}
.btn{font:inherit;font-size:12px;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;text-align:left}
.btn:hover{border-color:rgba(190,220,255,.4)}
.btn[aria-pressed="true"]{background:var(--accent);color:#0a0d14;border-color:var(--accent)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pals{position:fixed;top:16px;right:20px;display:flex;gap:6px}
.sizes{position:fixed;top:56px;right:20px;display:flex;gap:6px}
.modes{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px}
.ver{position:fixed;right:20px;bottom:22px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none}
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,0);pointer-events:none;text-align:center;white-space:nowrap;opacity:0;transition:opacity .35s}
.lbl b{display:block;font-weight:500;font-size:12px}
.lbl span{font-size:11px;color:var(--muted)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(420px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;display:none;gap:10px;opacity:0;transition:opacity .4s,transform .4s}
.panel.show{opacity:1;transform:translate(-50%,-50%)}
.panel .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.panel h2{margin:0;font-size:20px;font-weight:500;text-wrap:balance}
.panel p{margin:0;color:var(--muted);line-height:1.65}
.panel .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.panel a.go{font:inherit;font-size:12px;text-decoration:none;color:#0a0d14;background:var(--accent);border-radius:999px;padding:7px 14px}
.panel .soon{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:6px 14px}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:640px){.paths{flex-direction:row;flex-wrap:wrap;right:20px;bottom:64px}.modes{bottom:16px}}
</style>
</head>
<body>
<div id="stage" aria-label="沿曲线流动的泡泡画廊"></div>
<canvas id="foam" aria-hidden="true"></canvas>
<div class="hd"><h1>Awakenology 泡泡画廊</h1><p id="hint">点击轨迹进入 · 点亮着的泡泡打开内容</p></div>
<nav class="paths" aria-label="曲线">
  <button class="btn" data-path="0" aria-pressed="false">三叶结</button>
  <button class="btn" data-path="1" aria-pressed="false">利萨如</button>
  <button class="btn" data-path="2" aria-pressed="false">环面结</button>
  <button class="btn" data-path="3" aria-pressed="false">双纽线</button>
  <button class="btn" data-path="4" aria-pressed="false">环波</button>
  <button class="btn" data-path="5" aria-pressed="false">徽章 · 双轨</button>
  <button class="btn" data-path="6" aria-pressed="true">徽章 · 单轨</button>
</nav>
<div class="sizes" role="group" aria-label="泡泡大小">
  <button class="btn" data-size="0" aria-pressed="false">整体放大</button>
  <button class="btn" data-size="1" aria-pressed="false">珍珠渐变</button>
  <button class="btn" data-size="2" aria-pressed="true">疏朗大泡</button>
</div>
<div class="pals" role="group" aria-label="配色">
  <button class="btn" data-pal="0" aria-pressed="true">极光冷调</button>
  <button class="btn" data-pal="1" aria-pressed="false">粉彩高阶</button>
  <button class="btn" data-pal="2" aria-pressed="false">混搭</button>
</div>
<div class="modes">
  <button class="btn" id="overview" aria-pressed="true">总览</button>
  <button class="btn" id="mode" aria-pressed="false">Scroll</button>
</div>
<div class="ver">v2.6 · 晃动减半</div>
<div id="labels"></div>
<section class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="pTitle">
  <span class="k" id="pKey"></span>
  <h2 id="pTitle"></h2>
  <p id="pDesc"></p>
  <div class="row" id="pRow"></div>
</section>
<div class="err" id="err">这个浏览器无法运行 WebGL，画廊无法显示。</div>

function buildCurve(def) {
  const pts = [];
  if (def === 'badge1') {
    const xy = BADGE_SINGLE.trim().split(/\s+/).map(s => s.split(',').map(Number));
    xy.forEach(([x, y], i) => pts.push(new THREE.Vector3(x, y, 2.5 * Math.sin(i / xy.length * TAU * 3))));
    const c = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
    c.arcLengthDivisions = 1200; c.updateArcLengths(); return c;
  }
  if (def === 'badge') {
    const xy = BADGE.trim().split(/\s+/).map(s => s.split(',').map(Number));
    xy.forEach(([x, y], i) => pts.push(new THREE.Vector3(x, y, 2.5 * Math.sin(i / xy.length * TAU * 3))));
  } else for (let i = 0; i < 720; i++) { const p = def(i / 720 * TAU); pts.push(new THREE.Vector3(p[0], p[1], p[2])); }
  const c = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  c.arcLengthDivisions = 1200; c.updateArcLengths();
  return c;
}
const curves = CURVES.map(buildCurve);
const lens = curves.map(c => c.getLength());
const tmpP = new THREE.Vector3(), tmpT = new THREE.Vector3();
function placeOn(c, t, lateral, depth, out) {        // 曲线上 t 处的位置 + 横向/纵深偏移
  c.getPointAt(t, tmpP); c.getTangentAt(t, tmpT);
  const l = Math.hypot(tmpT.x, tmpT.y) || 1;
  return out.set(tmpP.x - tmpT.y / l * lateral, tmpP.y + tmpT.x / l * lateral, tmpP.z + depth);
}

/* ============================================================
   5. 泡泡：一个 InstancedMesh 画全部泡泡
   片元着色器里用数学把方块变成球：圆形裁切 + 球面法线 + 薄膜干涉 + Fresnel + 高光
   ============================================================ */
let seed = CONFIG.SEED;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const N = CONFIG.TOTAL, C = CONTENT.length, ALL = N + C;
const bubbles = [];
for (let i = 0; i < N; i++) bubbles.push({ t0: i / N, lat: rnd() * 2 - 1, dep: (rnd() * 2 - 1) * CONFIG.DEPTH,
  rB: CONFIG.BOLD.vary[0] + rnd() * (CONFIG.BOLD.vary[1] - CONFIG.BOLD.vary[0]), rC: 0.9 + rnd() * 0.2,
  ph: rnd() * TAU, scale: 1, kind: 0, pos: new THREE.Vector3() });
for (let i = 0; i < N; i++) {                       // 疏朗模式：从 520 颗里均匀挑出 150 颗做「领头」，移到等距位置
  const k = Math.floor(i * CONFIG.AIRY.count / N), b = bubbles[i];
  b.lead = i === 0 || k !== Math.floor((i - 1) * CONFIG.AIRY.count / N); b.tE = k / CONFIG.AIRY.count;
  b.rE = CONFIG.AIRY.vary[0] + rnd() * (CONFIG.AIRY.vary[1] - CONFIG.AIRY.vary[0]);
  b.tE += (rnd() - .5) * CONFIG.WOBBLE.slide / CONFIG.AIRY.count;   // 打乱等距：每颗前后错开一点
  b.sc = rnd() * 2 - 1;                                              // 静态横向错位
  const W = CONFIG.WOBBLE.speed, sp = () => (W[0] + rnd() * (W[1] - W[0])) * TAU;
  b.wf = [sp(), sp(), sp()]; b.wp = [rnd() * TAU, rnd() * TAU, rnd() * TAU, rnd() * TAU, rnd() * TAU, rnd() * TAU];
}
CONTENT.forEach((c, k) => bubbles.push({ t0: (k + 0.5) / C, lat: 0, dep: 0.6, size: CONFIG.BUBBLE_D * CONFIG.CONTENT_SCALE, ph: rnd() * TAU, scale: 1, kind: 1, content: k, pos: new THREE.Vector3() }));

/* 物理薄膜干涉：Belcour & Barla, SIGGRAPH 2017（three.js / Babylon.js 的 iridescence 用的同一模型）
   d = 膜厚（纳米），c1 = 视线与法线夹角余弦；配色只在物理亮度之上做色域映射 */
const THINFILM = `#define PI 3.14159265
float pw5(float x){float x2=x*x;return x2*x2*x;}
const mat3 X2R=mat3(3.2404542,-0.9692660,0.0556434,-1.5371385,1.8760108,-0.2040259,-0.4985314,0.0415560,1.0572252);
vec3 sens(float OPD,vec3 sh){float ph=2.*PI*OPD*1e-9;vec3 val=vec3(5.4856e-13,4.4201e-13,5.2481e-13),pos=vec3(1.6810e+06,1.7953e+06,2.2084e+06),vr=vec3(4.3278e+09,9.3046e+09,6.6121e+09);
 vec3 xyz=val*sqrt(2.*PI*vr)*cos(pos*ph+sh)*exp(-ph*ph*vr);xyz.x+=9.7470e-14*sqrt(2.*PI*4.5282e+09)*cos(2.2399e+06*ph+sh.x)*exp(-4.5282e+09*ph*ph);return X2R*(xyz/1.0685e-7);}
vec3 irid(float c1,float d){float eta=1.33;float c2=sqrt(1.-(1.-c1*c1)/(eta*eta));
 float R0=pow((eta-1.)/(eta+1.),2.);float R12=R0+(1.-R0)*pw5(1.-c1);float T121=1.-R12;float R23=R0+(1.-R0)*pw5(1.-c2);
 float OPD=2.*eta*d*c2;vec3 phi=vec3(2.*PI);float R123=clamp(R12*R23,1e-5,.9999);float r123=sqrt(R123);float Rs=T121*T121*R23/(1.-R123);
 vec3 I=vec3(R12+Rs);float Cm=Rs-T121;for(int m=1;m<=2;m++){Cm*=r123;I+=Cm*2.*sens(float(m)*OPD,float(m)*phi);}return max(I,0.);}
float envL(vec3 r){float top=smoothstep(.45,.95,r.y);float win=smoothstep(.16,0.,abs(r.x-.42))*smoothstep(.22,0.,abs(r.y-.22));return top*1.4+win*3.+smoothstep(-.2,-.9,r.y)*.25+.06;}
vec3 bubbleShade(vec3 nn,float sd,float tm,float pal){
 vec3 r=reflect(vec3(0,0,-1),nn);float lit=.35+2.2*envL(r);
 if(pal<.5){
  float d=mix(200.,800.,smoothstep(-1.,1.,-nn.y))+200.*(fbm(nn.xy*2.5+vec2(sd*7.,tm*.12))-.5);
  vec3 c=irid(nn.z,d);float l=dot(c,vec3(.3,.59,.11));float hue=fract(d/520.+fbm(nn.xy*3.+sd)*.3);
  vec3 pc=mix(mix(vec3(.15,.95,.85),vec3(.25,.45,1.),smoothstep(0.,.5,hue)),vec3(.7,.35,1.),smoothstep(.5,1.,hue));
  return pc*l*1.6*lit;}
 float d=1000.+450.*fbm(nn.xy*2.+vec2(sd*7.,tm*.1))+300.*(-nn.y);
 vec3 c=irid(nn.z,d)*lit;vec3 g=vec3(dot(c,vec3(.299,.587,.114)));return max(mix(g,c,1.25),0.);}
`;
const geo = new THREE.PlaneGeometry(1, 1);
const aSeed = new Float32Array(ALL), aKind = new Float32Array(ALL), aHue = new Float32Array(ALL);
bubbles.forEach((b, i) => { aSeed[i] = rnd(); aKind[i] = b.kind; aHue[i] = b.kind ? CONTENT[b.content].hue : 0; });
geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(aSeed, 1));
geo.setAttribute('aKind', new THREE.InstancedBufferAttribute(aKind, 1));
geo.setAttribute('aHue', new THREE.InstancedBufferAttribute(aHue, 1));
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uFog: { value: new THREE.Vector2(...CONFIG.FOG) }, uLit: { value: 1 }, uPal: { value: CONFIG.PALETTE } },
  vertexShader: `
    attribute float aSeed, aKind, aHue; varying vec2 vL; varying float vSeed, vKind, vHue, vDepth, vDim;
    void main(){ vL = uv; vSeed = aSeed; vKind = aKind; vHue = aHue; vDim = 1.;
      #ifdef USE_INSTANCING_COLOR
      vDim = instanceColor.r;
      #endif
      vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.); vDepth = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `
    uniform float uTime, uLit, uPal; uniform vec2 uFog; varying vec2 vL; varying float vSeed, vKind, vHue, vDepth, vDim;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
    ${THINFILM}
    void main(){
      vec2 q = vL * 2. - 1.; float r2 = dot(q, q); if (r2 > 1.) discard; float r = sqrt(r2);
      vec3 nn = vec3(q, sqrt(1. - r2)); float fr = pow(1. - nn.z, 2.2);
      float pal = uPal < 1.5 ? uPal : vKind;                                      // 0 极光冷调，1 粉彩高阶，2 混搭（装饰=极光，内容=粉彩）
      vec3 c = bubbleShade(nn, vSeed, uTime, pal);                                // Belcour–Barla 物理薄膜干涉
      if (vKind > .5) {                                                           // 内容泡泡：里面装着光
        vec3 tint = pal < .5 ? vec3(.55, .85, 1.) : vec3(1., .78, .88);
        float s = fbm(q * 3. + vec2(uTime * .3, vSeed * 9.));
        c += tint * (exp(-r2 * 6.) * .45 + s * s * smoothstep(1., .2, r) * .35) * uLit + vec3(.95) * exp(-r2 * 30.) * .35 * uLit;
      }
      c = 1. - exp(-c * 1.25);
      c *= smoothstep(1., .95, r) * vDim;                                         // 放大的泡泡变淡，叠在一起不过曝
      c *= 1. - smoothstep(uFog.x, uFog.y, vDepth) * .92;
      gl_FragColor = vec4(c, 1.);
      #include <colorspace_fragment>
    }`

const mesh = new THREE.InstancedMesh(geo, mat, ALL);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.frustumCulled = false; scene.add(mesh);
const dimColor = new THREE.Color();
for (let i = 0; i < ALL; i++) mesh.setColorAt(i, dimColor.setRGB(1, 1, 1));

const foamCv = document.getElementById('foam');
const fg = foamCv.getContext('webgl', { premultipliedAlpha: true, alpha: true });
const FOAM_FS = `precision highp float;uniform vec2 R,Cc;uniform float T,P,Pal;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
${THINFILM}
float hd(vec2 g){g=abs(g);return max(dot(g,normalize(vec2(1.,1.7320508))),g.x);}
void main(){vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;vec2 cc=(Cc*2.-R)/R.y;float d=length(uv-cc);
 float rad=P*2.6,m=smoothstep(rad,rad-.35,d);if(m<=0.){gl_FragColor=vec4(0.);return;}
 vec2 p=(uv-cc)*mix(1.3,3.,P)+vec2(T*.05,T*.03);p+=.07*vec2(sin(p.y*2.+T*.7),cos(p.x*2.-T*.6));
 vec2 s=vec2(1.,1.7320508),hh=s*.5;vec2 a=mod(p,s)-hh,b=mod(p-hh,s)-hh;vec2 g=dot(a,a)<dot(b,b)?a:b;vec2 id=p-g;
 float r=hd(g)/.5;vec3 nn=normalize(vec3(g/.5,sqrt(max(1.-r*r,0.))));

 col=mix(col,fc,smoothstep(.8,1.,r)*.5);
 col+=vec3(1.,.85,.7)*exp(-abs(d-rad+.18)*14.)*.5*(1.-P);
 float a2=m*.94;gl_FragColor=vec4(col*a2,a2);}`;
let foamDraw = null;
if (fg) {
  const mk = (t, s) => { const o = fg.createShader(t); fg.shaderSource(o, s); fg.compileShader(o); return o; };
  const pr = fg.createProgram(); fg.attachShader(pr, mk(fg.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
  fg.attachShader(pr, mk(fg.FRAGMENT_SHADER, FOAM_FS)); fg.linkProgram(pr); fg.useProgram(pr);

    fg.viewport(0, 0, w, h); fg.clearColor(0, 0, 0, 0); fg.clear(fg.COLOR_BUFFER_BIT);
    fg.uniform2f(uR, w, h); fg.uniform2f(uC, cx * dpr, h - cy * dpr); fg.uniform1f(uT, t); fg.uniform1f(uP, p); fg.uniform1f(uPal, mat.uniforms.uPal.value > 1.5 ? 1 : mat.uniforms.uPal.value); fg.drawArrays(fg.TRIANGLES, 0, 3);

   7. 状态
   ============================================================ */
let pathIndex = CONFIG.START_PATH, curve = curves[pathIndex], prevCurve = null, morphStart = 0, morphE = 1;
let targetT = 0, camT = 0, auto = false, flow = 0;
let overview = CONFIG.START_IN_OVERVIEW, ov = overview ? 1 : 0, ovPose = null;
let openK = -1, foamP = 0, foamTarget = 0, foamAt = [innerWidth / 2, innerHeight / 2];
const camPos = new THREE.Vector3(), camTarget = new THREE.Vector3(), pA = new THREE.Vector3(), pB = new THREE.Vector3();
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const damp = (cur, target, seconds, dt) => cur + (target - cur) * (1 - Math.exp(-dt * 3 / seconds));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hint = document.getElementById('hint'), ovBtn = document.getElementById('overview');
function overviewPose(c) {
  const box = new THREE.Box3().setFromPoints(c.getPoints(400));
  const ctr = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const half = Math.max(s.y / 2, s.x / 2 / camera.aspect) * CONFIG.OVERVIEW_MARGIN + 1.5;
  return new THREE.Vector3(ctr.x, ctr.y, box.max.z + half / Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV / 2)));
}
function setOverview(on) {
  overview = on; ovBtn.setAttribute('aria-pressed', on);
  hint.textContent = on ? '点击轨迹进入 · 点亮着的泡泡打开内容' : '滚动、拖动或方向键前进 · Esc 返回总览';
}
setOverview(overview);

/* 内容标签：跟着内容泡泡走的 HTML 文字 */
const labelBox = document.getElementById('labels');
const labels = CONTENT.map(c => { const d = document.createElement('div'); d.className = 'lbl';
  d.innerHTML = '<b></b><span></span>'; d.querySelector('b').textContent = c.title; d.querySelector('span').textContent = c.url ? c.sub : c.sub + ' · 即将上线';
  labelBox.appendChild(d); return d; });

/* 内容面板 */
const panel = document.getElementById('panel');
function openContent(k, x, y) {
  openK = k; foamAt = [x, y]; foamTarget = 1; if (reduceMotion) foamP = 1;
  const c = CONTENT[k];
  document.getElementById('pKey').textContent = c.key + ' · ' + c.sub;
  document.getElementById('pTitle').textContent = c.title;
  document.getElementById('pDesc').textContent = c.desc;
  const row = document.getElementById('pRow'); row.innerHTML = '';
  if (c.url) { const a = document.createElement('a'); a.className = 'go'; a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '打开页面 ↗'; row.appendChild(a); }
  else { const s = document.createElement('span'); s.className = 'soon'; s.textContent = '即将上线'; row.appendChild(s); }
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = '返回画廊'; b.onclick = closeContent; row.appendChild(b);
  foamCv.style.display = 'block'; foamCv.style.pointerEvents = 'auto';
  setTimeout(() => { if (openK === k) { panel.style.display = 'grid'; requestAnimationFrame(() => panel.classList.add('show')); b.focus(); } }, reduceMotion ? 0 : CONFIG.FOAM_TIME * 550);
}
function closeContent() {
  if (openK < 0) return; openK = -1; foamTarget = 0; panel.classList.remove('show');
  foamCv.style.pointerEvents = 'none'; setTimeout(() => { if (openK < 0) panel.style.display = 'none'; }, 400);
}
foamCv.addEventListener('click', closeContent);

/* ============================================================
   8. 输入
   ============================================================ */
const sens = () => CONFIG.SENSITIVITY / (innerHeight * 4);
const push = dy => { if (!auto && !overview && openK < 0) targetT += dy * sens(); };
addEventListener('wheel', e => { e.preventDefault(); push(e.deltaY); }, { passive: false });
let dragY = null, downAt = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { dragY = e.clientY; downAt = [e.clientX, e.clientY]; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (dragY !== null) { push((dragY - e.clientY) * 2); dragY = e.clientY; } hover(e.clientX, e.clientY); });
stage.addEventListener('pointerup', e => {
  const moved = downAt ? Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) : 99; dragY = null; downAt = null;
  if (moved < 6) clickAt(e.clientX, e.clientY);
});
const scr = new THREE.Vector3();
function toScreen(v) { scr.copy(v).project(camera); return [(scr.x + 1) / 2 * innerWidth, (1 - scr.y) / 2 * innerHeight, scr.z]; }
function screenRadius(b) { const d = camera.position.distanceTo(b.pos); return b.size * b.scale / 2 / (d * Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV / 2))) * innerHeight / 2; }
function contentAt(x, y) {
  for (let k = 0; k < C; k++) { const b = bubbles[N + k], [sx, sy, sz] = toScreen(b.pos);
    if (sz < 1 && Math.hypot(sx - x, sy - y) < Math.max(26, screenRadius(b))) return k; }
  return -1;
}
function hover(x, y) { stage.style.cursor = contentAt(x, y) >= 0 ? 'pointer' : (overview ? 'zoom-in' : 'grab'); }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
function jumpTo(tt) { camT = targetT = curve.closed ? Math.round(camT) + (1 - tt) : tt; }
function clickAt(x, y) {
  if (openK >= 0) return;
  const k = contentAt(x, y);
  if (k >= 0) { const b = bubbles[N + k]; if (overview) { jumpTo(b.t0); setOverview(false); } openContent(k, x, y); return; }
  if (!overview) return;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return;
  let best = null, bd = Infinity;
  for (let i = 0; i < N; i++) { const b = bubbles[i], d = Math.hypot(b.pos.x - hit.x, b.pos.y - hit.y); if (d < bd) { bd = d; best = b; } }
  if (!best || bd > 4) return;
  jumpTo((best.t0 + flow) % 1); setOverview(false);
}
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (openK >= 0) closeContent(); else setOverview(true); return; }
  if (openK >= 0) return;
  if (e.key === 'Enter' && overview) { setOverview(false); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); push(innerHeight * .25); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); push(-innerHeight * .25); }
});
ovBtn.addEventListener('click', () => { closeContent(); setOverview(!overview); });
document.querySelectorAll('.sizes .btn').forEach(btn => btn.addEventListener('click', () => {
  CONFIG.SIZE_MODE = +btn.dataset.size;
  document.querySelectorAll('.sizes .btn').forEach(b => b.setAttribute('aria-pressed', b === btn));
}));
document.querySelectorAll('.pals .btn').forEach(btn => btn.addEventListener('click', () => {
  mat.uniforms.uPal.value = +btn.dataset.pal;
  document.querySelectorAll('.pals .btn').forEach(b => b.setAttribute('aria-pressed', b === btn));
}));
const modeBtn = document.getElementById('mode');
modeBtn.addEventListener('click', () => { auto = !auto; modeBtn.textContent = auto ? 'Auto' : 'Scroll'; modeBtn.setAttribute('aria-pressed', auto); if (auto) setOverview(false); });
document.querySelectorAll('.paths .btn').forEach(btn => btn.addEventListener('click', () => {
  const i = +btn.dataset.path; if (i === pathIndex) return;
  document.querySelectorAll('.paths .btn').forEach(b => b.setAttribute('aria-pressed', b === btn));
  prevCurve = curve; pathIndex = i; curve = curves[i]; ovPose = null; morphStart = performance.now(); morphE = 0;
}));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); ovPose = null; });

/* ============================================================
   9. 每帧
   ============================================================ */
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3();
let sm = CONFIG.SIZE_MODE === 1 ? 1 : 0, se = CONFIG.SIZE_MODE === 2 ? 1 : 0;   // sm：B↔C 混合；se：疏朗模式权重
function bubbleSize(b, tt) {                        // 泡泡直径：B 统一放大，C 沿路径渐大渐小（节奏固定在空间里，泡泡流过时依次胀缩）
  if (b.kind) return b.size;
  const bold = CONFIG.BOLD.d * b.rB;
  const P = CONFIG.PEARL, wave = .5 + .5 * Math.sin(tt * TAU * P.waves);
  const pearl = P.d * (P.min + (P.max - P.min) * wave) * b.rC;
  const chain = bold + (pearl - bold) * sm;
  const airy = b.lead ? CONFIG.AIRY.d * b.rE : 0;     // 疏朗模式：只有「领头」的 150 颗保留，其余缩到 0
  return chain + (airy - chain) * se;
}
const focusScale = d => { const f = 1 - d / CONFIG.FOCUS_DIST; return 1 + f * f * f * (CONFIG.MAX_SCALE - 1); };
let last = performance.now(); const t0 = last;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; const T = Math.max(0, (now - t0) / 1000);
  mat.uniforms.uTime.value = T;

  if (!reduceMotion) flow = (flow + dt * CONFIG.FLOW_SPEED) % 1;
  if (auto && !reduceMotion && !overview && openK < 0) targetT += dt / CONFIG.AUTO_LOOP_SECONDS;
  const open = !curve.closed;                      // 开放曲线（单轨徽章）：镜头不绕圈，在两端停住
  if (open) targetT = Math.min(1, Math.max(0, targetT));
  camT = damp(camT, targetT, CONFIG.CAM_EASE, dt);
  const t = open ? Math.min(1, Math.max(0, camT)) : ((1 - camT) % 1 + 1) % 1;

  if (morphE < 1) { morphE = easeInOut(Math.min(1, (now - morphStart) / (CONFIG.MORPH_TIME * 1000))); if (morphE >= 1) prevCurve = null; }
  const len = prevCurve ? lens[curves.indexOf(prevCurve)] + (lens[pathIndex] - lens[curves.indexOf(prevCurve)]) * morphE : lens[pathIndex];
  const mode = CONFIG.SIZE_MODE;                   // 大小方案之间平滑过渡
  if (mode !== 2) sm = reduceMotion ? mode : damp(sm, mode, 0.8, dt);
  se = reduceMotion ? (mode === 2 ? 1 : 0) : damp(se, mode === 2 ? 1 : 0, 0.9, dt);

  const at = (tt, lat, dep, out) => { placeOn(curve, tt, lat, dep, out); if (prevCurve) { placeOn(prevCurve, tt, lat, dep, pA); pB.copy(out); out.lerpVectors(pA, pB, morphE); } return out; };
  at(t, 0, 0, camPos); camPos.z += CONFIG.CAM_Z;
  if (!ovPose) ovPose = overviewPose(curve);
  ov = reduceMotion ? (overview ? 1 : 0) : damp(ov, overview ? 1 : 0, CONFIG.OVERVIEW_EASE, dt);
  const e = ov * ov * (3 - 2 * ov);
  camera.position.lerpVectors(camPos, ovPose, e);
  const ovD = ovPose.z;
  mat.uniforms.uFog.value.set(CONFIG.FOG[0] + (ovD * .9 - CONFIG.FOG[0]) * e, CONFIG.FOG[1] + (ovD * 1.8 - CONFIG.FOG[1]) * e);

  for (let i = 0; i < ALL; i++) {
    const b = bubbles[i], base = b.kind ? b.t0 : b.t0 + (b.lead ? (b.tE - b.t0) * se : 0);
    const tt = b.kind ? b.t0 : ((base + flow) % 1 + 1) % 1;
    const lat = b.kind ? 0 : b.lat * (CONFIG.BOLD.lateral + (CONFIG.PEARL.lateral - CONFIG.BOLD.lateral) * sm) * (1 - se) + (b.sc || 0) * CONFIG.WOBBLE.scatter * se;
    at(tt, lat, b.dep, b.pos);
    if (!b.kind && !reduceMotion) {                  // 360° 随机晃动：每颗泡泡在 x/y/z 上各自用两组不同频率的正弦叠加漂移，轨迹像利萨如曲线，永不重复
      const A = CONFIG.WOBBLE.amp * (.35 + .65 * se), f = b.wf, ph = b.wp;
      b.pos.x += A * (.65 * Math.sin(T * f[0] + ph[0]) + .35 * Math.sin(T * f[1] * 1.73 + ph[3]));
      b.pos.y += A * (.65 * Math.sin(T * f[1] + ph[1]) + .35 * Math.sin(T * f[2] * 1.41 + ph[4]));
      b.pos.z += A * (CONFIG.WOBBLE.depth / CONFIG.WOBBLE.amp) * (.65 * Math.sin(T * f[2] + ph[2]) + .35 * Math.sin(T * f[0] * 1.29 + ph[5]));
    }
    const dx = camera.position.x - b.pos.x, dy = camera.position.y - b.pos.y, dz = Math.abs(camera.position.z - b.pos.z), dxy = Math.hypot(dx, dy);
    let dT = Math.abs(tt - t); if (!open && dT > .5) dT = 1 - dT;
    const inFocus = dT < CONFIG.FOCUS_DIST * 1.5 / len && dz < CONFIG.Z_GATE && dxy < CONFIG.FOCUS_DIST;
    const target = (inFocus ? 1 + (focusScale(dxy) - 1) * (1 - e) * (b.kind ? .35 : 1) * (1 - .5 * se) : 1) * (b.kind ? 1 + .35 * e : 1);   // 疏朗模式泡泡本身已大，镜头前放大减半
    b.scale = damp(b.scale, target, CONFIG.SCALE_EASE, dt);
    let breath = 1 + CONFIG.BREATH * Math.sin(T * 1.3 + b.ph);
    if (open && !b.kind) breath *= Math.min(1, tt / .02, (1 - tt) / .02);   // 开放曲线两端：泡泡在起点长出、在终点消失
    const sz = bubbleSize(b, tt);
    S.setScalar(sz * b.scale * breath); M.compose(b.pos, Q, S); mesh.setMatrixAt(i, M);
    const spacing = len / (N + (CONFIG.AIRY.count - N) * se);
    const density = b.kind ? 1 : Math.min(1, Math.max(.3, spacing / Math.max(sz * .5, 1e-3)));   // 重叠越多，单颗越淡，叠加后总亮度保持柔和
    const dim = density / (1 + (b.scale - 1) * 1.4); mesh.setColorAt(i, dimColor.setRGB(dim, dim, dim));
  }
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;

  for (let k = 0; k < C; k++) {                       // 标签：总览时全部显示，漫游时只显示附近的
    const b = bubbles[N + k], [sx, sy, sz] = toScreen(b.pos), near = Math.hypot(camera.position.x - b.pos.x, camera.position.y - b.pos.y) < 7;
    const show = sz < 1 && openK < 0 && (overview || near);
    labels[k].style.opacity = show ? 1 : 0;
    labels[k].style.transform = `translate(${sx}px, ${sy + screenRadius(b) + 6}px) translate(-50%, 0)`;
  }

  foamP = reduceMotion ? foamTarget : damp(foamP, foamTarget, CONFIG.FOAM_TIME, dt);
  if (foamDraw && foamP > .002) foamDraw(T, foamP, foamAt[0], foamAt[1]);
  else if (foamP <= .002 && foamTarget === 0) foamCv.style.display = 'none';
  mat.uniforms.uLit.value = 1;
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
