<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>第1靈體 · 藍色網光體</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 预渲染帧序列 + 滚动播放：往下滑 = 绕人体转一圈。单一深色画面（与渲染一致） */
  :root { color-scheme:dark; --bg:#000; --fg:#e9ecf4; --muted:#8a93a8; --blue:#2f6bff; --line:rgba(120,150,255,.18);
          --serif:"Noto Serif TC","Songti TC",Georgia,serif; --mono:ui-monospace,Menlo,monospace; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:15px/1.75 var(--serif); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #track { position:fixed; inset:0; overflow-y:auto; z-index:1; scrollbar-width:none; overscroll-behavior:contain; }
  #track::-webkit-scrollbar { display:none; }
  #spacer { height:600vh; }
  .card { position:fixed; z-index:2; left:max(16px, env(safe-area-inset-left,0px)); right:max(16px, env(safe-area-inset-right,0px));
          bottom:calc(18px + env(safe-area-inset-bottom,0px)); max-width:400px; padding:14px 16px;
          border:1px solid var(--line); border-radius:4px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); pointer-events:none; }
  .card small { font:11px var(--mono); letter-spacing:.16em; color:var(--muted); }
  .card h1 { font-weight:400; font-size:1.35rem; letter-spacing:.06em; margin:.3rem 0 .4rem; text-wrap:balance; }
  .card p { color:#c9cede; font-size:.9rem; }
  .bar { position:fixed; z-index:2; top:calc(14px + env(safe-area-inset-top,0px)); left:max(16px, env(safe-area-inset-left,0px));
         right:max(16px, env(safe-area-inset-right,0px)); display:flex; justify-content:space-between; gap:12px;
         font:11px var(--mono); color:var(--muted); letter-spacing:.12em; pointer-events:none; }
  .deg { font-variant-numeric:tabular-nums; }
  @media (min-width:900px) { .card { left:6vw; bottom:auto; top:50%; transform:translateY(-50%); } }
</style>

<canvas id="c"></canvas>
<div class="bar"><span>P2 · 02 / 12 · 往下滑 360°</span><span class="deg" id="deg">0°</span></div>
<div class="card">
  <small>B 靈體 · 第2身</small>
  <h1>第1靈體 · 藍色網光體</h1>
  <p>以太體。由藍白光線構成的網，外延肉體約 1–5 厘米，是肉體的模板，主管生理與感官。洋紅細線為肉體輪廓。</p>
</div>
<main id="track"><div id="spacer"></div></main>

<script>
const N = 72;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const track = document.getElementById('track'), deg = document.getElementById('deg');
const imgs = Array.from({ length: N }, (_, i) => { const im = new Image(); im.src = `v12/${String(i + 1).padStart(4, '0')}.jpg`; im.onload = draw; return im; });
let cur = 0;
function frameAt() {
  const max = track.scrollHeight - track.clientHeight;
  return Math.min(N - 1, Math.max(0, Math.round(track.scrollTop / Math.max(max, 1) * (N - 1))));
}
function draw() {
  cur = frameAt();
  let im = imgs[cur];
  if (!im.complete || !im.naturalWidth) { im = imgs.find(x => x.complete && x.naturalWidth); if (!im) return; }
  const W = canvas.width, H = canvas.height, s = Math.min(W / im.naturalWidth, H / im.naturalHeight);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(im, (W - im.naturalWidth * s) / 2, (H - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s);
  deg.textContent = Math.round(cur / N * 360) + '°';
}
function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; draw(); }
track.addEventListener('scroll', () => requestAnimationFrame(draw), { passive: true });
addEventListener('resize', resize); resize();
</script>

</body></html>
