<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光学渲染效果库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* one dark visual world: effects glow on ink; cards are dark windows, chips are the only bright UI */
  --ink:#090b11;
  --panel:#10131b;
  --line:#222736;
  --text:#e6e8ee;
  --muted:#8b91a3;
  --glow:#86b6ff;
  --f-display:"Unbounded","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:var(--glow)}
.wrap{max-width:1240px;margin:0 auto;padding:32px 20px 64px}
header{display:grid;gap:14px;margin-bottom:24px}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:68ch}
.sub code{font-family:var(--f-mono);font-size:13px;color:var(--glow);background:#141a28;padding:1px 6px;border-radius:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .lab{font-size:12px;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip:hover{color:var(--text);border-color:#3a4258}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--glow);border-color:var(--glow)}
.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.count{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.sec{margin-top:28px}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--muted);margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.sec h2 span{font-family:var(--f-mono);font-size:12px;color:#596075}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.card:hover{border-color:#3a4258}
.card canvas{display:block;width:100%;aspect-ratio:16/10;background:#05060a}
.card .meta{padding:10px 12px 12px;display:grid;gap:4px}
.card .nm{font-weight:500;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.card .id{font-family:var(--f-mono);font-size:11px;color:#596075}
.card .ds{font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:11px;color:#a9c8ff;background:#152033;border-radius:4px;padding:1px 7px}
.viewer{position:fixed;inset:0;background:rgba(5,6,10,.86);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;z-index:10}
.viewer.open{display:flex}
.vpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:1160px;width:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.vpanel{grid-template-columns:1fr}}
.vstage{position:relative;background:#05060a;border-radius:12px 0 0 12px;overflow:hidden}
@media (max-width:820px){.vstage{border-radius:12px 12px 0 0}}
.vstage canvas{display:block;width:100%;aspect-ratio:16/10}
.vctl{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.vctl input{flex:1;accent-color:var(--glow)}
.vinfo{padding:18px 20px;display:grid;gap:14px;align-content:start}
.vinfo h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;text-wrap:balance}
.vinfo .en{font-size:13px;color:var(--muted);margin-top:-10px}
.field{display:grid;gap:4px}
.field .k{font-size:11px;letter-spacing:.06em;color:#596075}
.field .v{font-size:14px}
.prompt{font-family:var(--f-mono);font-size:12.5px;background:#0b0e15;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:#c9d6f0}
.btn{font:inherit;font-size:13px;color:var(--text);background:#182031;border:1px solid #2c3650;border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:#1f2a40}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.close{position:absolute;top:10px;right:10px;background:rgba(9,11,17,.7)}
pre.src{margin:0;max-height:260px;overflow:auto;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;background:#0b0e15;border:1px solid var(--line);border-radius:6px;padding:10px;color:#aeb8cc;white-space:pre-wrap;word-break:break-all}
.toast{font-size:12px;color:var(--glow)}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);max-width:72ch}
@media (prefers-reduced-motion:reduce){.chip,.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>光学渲染效果库</h1>
  <p class="sub">P1《摧毀只是一瞬間》和 P2 多次元複合體用到的 22 个纯数学实时效果，全部由公式算出，没有用图片或模型。点开任意一个可以放大预览、调速度、复制提示词和源码。在对话里写 <code>调用效果库：body + net</code>，或直接打开带 <code>#body</code> 的链接，就能叫出对应效果。</p>
  <div class="filters" role="group" aria-label="按项目筛选">
    <span class="lab">用在</span>
    <button class="chip" data-use="all" aria-pressed="true">全部</button>
    <button class="chip" data-use="P1" aria-pressed="false">P1 艺术馆</button>
    <button class="chip" data-use="P2" aria-pressed="false">P2 复合体</button>
    <button class="chip" data-use="bg" aria-pressed="false">背景氛围</button>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="main"></main>
<footer>正式开发时，这些 shader 会迁移到 Three.js WebGPURenderer + TSL，大量粒子交给 compute shader；写实肉体层可另配 3D Gaussian Splatting。这个页面只是样板和练习场，所有效果都可以组合叠加。</footer>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vname">
  <div class="vpanel">
    <div class="vstage">
      <canvas id="vgl" width="960" height="600"></canvas>
      <canvas id="v2d" width="960" height="600" style="display:none"></canvas>
      <button class="btn close" id="vclose" aria-label="关闭预览">关闭</button>
      <div class="vctl">
        <button class="btn" id="vplay">暂停</button>
        <label for="vspeed">速度</label>
        <input type="range" id="vspeed" min="0" max="3" step="0.1" value="1">
        <span id="vspeedv" style="font-variant-numeric:tabular-nums;min-width:32px">1.0×</span>
      </div>
    </div>
    <div class="vinfo">
      <div><h3 id="vname"></h3></div>
      <div class="en" id="ven"></div>
      <div class="field"><span class="k">调用代号</span><span class="v" id="vid" style="font-family:var(--f-mono)"></span></div>
      <div class="field"><span class="k">原理</span><span class="v" id="vtech"></span></div>
      <div class="field"><span class="k">适合用在</span><span class="v" id="vuse"></span></div>
      <div class="field"><span class="k">提示词</span><div class="prompt" id="vprompt"></div></div>
      <div class="row"><button class="btn" id="cpPrompt">复制提示词</button><button class="btn" id="cpSrc">复制源码</button><span class="toast" id="toast" aria-live="polite"></span></div>
      <div class="field"><span class="k">源码</span><pre class="src" id="vsrc"></pre></div>
    </div>
  </div>
</div>

<script>
const PRE=`precision highp float;uniform vec2 R;uniform float T;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
vec2 vor(vec2 x){vec2 i=floor(x),f=fract(x);float f1=8.,f2=8.;for(int y=-1;y<=1;y++)for(int k=-1;k<=1;k++){vec2 g=vec2(float(k),float(y));vec2 o=h2(i+g);o=.5+.4*sin(T*.6+6.2832*o);float d=length(g+o-f);if(d<f1){f2=f1;f1=d;}else if(d<f2)f2=d;}return vec2(f1,f2);}
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+1.),f.x),f.y),f.z);}
float f3(vec3 p){return .5*n3(p)+.25*n3(p*2.03)+.125*n3(p*4.01);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
`;
const UV='vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;';
const CATS=[
 ["form","形体与分形","SDF · fractal · TPMS"],
 ["optics","光学","fresnel · refraction · interference"],
 ["lines","结构线与轨迹","voronoi · ODE · parametric"],
 ["atmo","流动与氛围","noise · volume · particles"],
 ["break","破坏与维度","dissolve · 4D projection"]
];
const FX=[
{id:"body",cat:"form",nm:"SDF 光体人形",en:"SDF light body",ds:"符号距离场 + Fresnel 边缘光",use:["P2"],useTxt:"P2 网光体、各层光体的基础人形",
tech:"用符号距离函数（SDF）拼出头、躯干、四肢，平滑并集连接；光线步进求交，Fresnel 公式算边缘光，移动扫描线表示网状能量。",
prompt:"SDF raymarched humanoid, smooth-union capsules, fresnel rim glow, moving scanlines, blue light body",
glsl:`float smin(float a,float b,float k){float hh=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,hh)-k*hh*(1.-hh);}
float cap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float hh=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*hh)-r;}
float map(vec3 p){p.xz=rot(T*.4)*p.xz;vec3 q=p;q.x=abs(q.x);
float d=length(p-vec3(0,.78,0))-.14;d=smin(d,cap(p,vec3(0,.55,0),vec3(0,.05,0),.16),.1);
d=smin(d,cap(q,vec3(.18,.52,0),vec3(.42,.02,0),.055),.08);d=smin(d,cap(q,vec3(.09,.02,0),vec3(.12,-.78,0),.075),.08);return d;}
void main(){${UV}vec3 ro=vec3(0,0,2.4),rd=normalize(vec3(uv,-1.6));float t=0.,md=9.;
for(int i=0;i<80;i++){float d=map(ro+rd*t);md=min(md,d);if(d<.001||t>5.)break;t+=d;}
vec3 col=vec3(.01,.015,.03)+vec3(.1,.35,1.)*exp(-md*9.)*.45;
if(t<5.){vec3 p=ro+rd*t;vec2 e=vec2(.001,0);vec3 nn=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
float fr=pow(1.-abs(dot(nn,rd)),2.5);float g=smoothstep(.9,1.,abs(sin(p.y*70.-T*3.)));col+=vec3(.2,.55,1.)*fr*1.4+vec3(.3,.7,1.)*g*.35*(.3+fr);}
gl_FragColor=vec4(col,1.);}`},
{id:"jul",cat:"form",nm:"Julia 分形",en:"Julia set",ds:"复数迭代 z² + c",use:["P1"],useTxt:"P1 抽象展厅墙面、章节转场",
tech:"在复平面上反复迭代 z² + c，参数 c 缓慢移动，用平滑逃逸次数着色。",
prompt:"animated Julia set, smooth escape-time coloring, cosine palette, slowly orbiting c",
glsl:`void main(){vec2 z=(gl_FragCoord.xy*2.-R)/R.y*1.25;vec2 c=vec2(-.79+.06*cos(T*.3),.15+.06*sin(T*.4));float it=0.;
for(int i=0;i<90;i++){z=vec2(z.x*z.x-z.y*z.y,2.*z.x*z.y)+c;if(dot(z,z)>16.)break;it+=1.;}
vec3 col=vec3(0.);if(it<89.){float sm=it-log2(log2(dot(z,z)))+4.;col=.5+.5*cos(3.+sm/90.*12.+vec3(0.,.6,1.));col*=smoothstep(0.,12.,it);}gl_FragColor=vec4(col,1.);}`},
{id:"mb",cat:"form",nm:"Mandelbulb",en:"Mandelbulb 3D fractal",ds:"三维分形",use:["P1"],useTxt:"P1 抽象展厅的中心雕塑",
tech:"8 次幂 Mandelbulb 的距离估计函数，用 orbit trap 着色，用步进次数近似环境光遮蔽。",
prompt:"raymarched Mandelbulb power 8, distance estimator, orbit-trap coloring, step-count ambient occlusion, orbiting camera",
glsl:`float de(vec3 p,out float tr){vec3 z=p;float dr=1.,r=0.;tr=9.;for(int i=0;i<6;i++){r=length(z);if(r>2.)break;
float th=acos(clamp(z.z/r,-1.,1.))*8.,ph=atan(z.y,z.x)*8.;dr=pow(r,7.)*8.*dr+1.;z=pow(r,8.)*vec3(sin(th)*cos(ph),sin(th)*sin(ph),cos(th))+p;tr=min(tr,length(z));}return .5*log(r)*r/dr;}
void main(){${UV}vec3 ro=vec3(0,0,2.4);ro.xz=rot(T*.15)*ro.xz;vec3 f=normalize(-ro),rr=normalize(cross(vec3(0,1,0),f)),u=cross(f,rr),rd=normalize(f*1.8+uv.x*rr+uv.y*u);
float t=.5,tr=0.,st=0.;bool hit=false;for(int i=0;i<80;i++){float d=de(ro+rd*t,tr);if(d<.0015*t){hit=true;break;}t+=d;st+=1.;if(t>5.)break;}
vec3 col=vec3(.02,.015,.04);if(hit){col=mix(vec3(.35,.15,.6),vec3(1.,.75,.35),clamp(tr*.8,0.,1.))*(1.-st/80.)*1.4;}gl_FragColor=vec4(col,1.);}`},
{id:"gyr",cat:"form",nm:"Gyroid 极小曲面",en:"Gyroid TPMS lattice",ds:"三周期极小曲面晶格",use:["P2"],useTxt:"P2 网光体的内部骨架、能量晶格",
tech:"陀螺极小曲面 sin(p)·cos(p.zxy) 取绝对值成薄壳，再与球体求交，外围加距离发光。",
prompt:"gyroid triply periodic minimal surface shell clipped by sphere, raymarched, cyan diffuse, fresnel, distance glow",
glsl:`float map(vec3 p){p.xz=rot(T*.25)*p.xz;p.yz=rot(.4)*p.yz;float s=7.;float g=abs(dot(sin(p*s),cos(p.zxy*s)))/s-.025;return max(g*.6,length(p)-.95);}
void main(){${UV}vec3 ro=vec3(0,0,2.4),rd=normalize(vec3(uv,-1.6));float t=0.,md=9.;bool hit=false;
for(int i=0;i<90;i++){float d=map(ro+rd*t);md=min(md,d);if(d<.0008){hit=true;break;}t+=d;if(t>4.)break;}
vec3 col=vec3(.01,.015,.03)+vec3(.1,.4,.9)*exp(-md*25.)*.3;
if(hit){vec3 p=ro+rd*t;vec2 e=vec2(.001,0);vec3 nn=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
float df=max(dot(nn,normalize(vec3(.5,.7,.6))),0.),fr=pow(1.-abs(dot(nn,rd)),2.);col=mix(vec3(.05,.2,.5),vec3(.4,.85,1.),df)*(.4+.6*smoothstep(3.4,1.6,t))+vec3(.6,.9,1.)*fr*.6;}
gl_FragColor=vec4(col,1.);}`},
{id:"iri",cat:"optics",nm:"薄膜干涉虹彩",en:"Thin-film iridescence",ds:"肥皂泡、全息片的干涉色",use:["P2"],useTxt:"P2 高阶身的表面质感",
tech:"按球面法线和视角估算薄膜光程差，用余弦调色还原干涉色，叠加 Fresnel 和高光。",
prompt:"thin-film interference iridescent sphere, view-dependent cosine palette, fbm thickness, fresnel, specular",
glsl:`void main(){${UV}vec3 ro=vec3(0,0,2.5),rd=normalize(vec3(uv,-1.6));float b=dot(ro,rd),c=dot(ro,ro)-.81,hh=b*b-c;
vec3 col=vec3(.02,.02,.04);if(hh>0.){float t=-b-sqrt(hh);vec3 p=ro+rd*t,nn=normalize(p);float th=fbm(nn.xy*2.5+vec2(T*.15,T*.1))*1.5+nn.z*.3;float ct=dot(nn,-rd);
vec3 ir=.5+.5*cos(6.2832*(th+ct*.8+vec3(0.,.33,.67)));float fr=pow(1.-ct,2.);col=ir*(.25+.9*fr)+vec3(pow(max(dot(reflect(rd,nn),normalize(vec3(.5,.6,1.))),0.),40.)*.8);}
gl_FragColor=vec4(col,1.);}`},
{id:"god",cat:"optics",nm:"体积光",en:"Volumetric god rays",ds:"光线穿过遮挡物散射",use:["P1"],useTxt:"P1 入口和展厅的主光",
tech:"屏幕空间径向采样：从每个像素朝光源方向走 60 步，累积没被遮挡的亮度，形成光束。",
prompt:"screen-space volumetric light scattering, radial sampling toward light, rotating occluder spokes, warm god rays",
glsl:`float occ(vec2 p){float a=atan(p.y,p.x),r=length(p);return step(.22,r)*step(r,.5)*step(.15,sin(a*7.+T*.4+r*6.));}
float lit(vec2 p){return smoothstep(.55,0.,length(p))*(1.-occ(p));}
void main(){${UV}vec2 d=uv/60.,p=uv;float acc=0.,w=1.;for(int i=0;i<60;i++){acc+=lit(p)*w;w*=.97;p-=d;}
vec3 col=vec3(1.,.8,.55)*acc*.05;col=mix(col,vec3(.03,.02,.02),occ(uv)*.85);col+=vec3(1.,.9,.7)*smoothstep(.2,0.,length(uv))*.6;gl_FragColor=vec4(1.-exp(-col*1.5),1.);}`},
{id:"cau",cat:"optics",nm:"水波焦散",en:"Water caustics",ds:"折射光聚焦的光网",use:["P1","bg"],useTxt:"P1 展厅地面、水下氛围",
tech:"多次迭代三角函数扭曲坐标，取倒数距离再求幂，得到水底那种会流动的焦散光网。",
prompt:"tileable procedural water caustics, iterative trig warping, sharp bright filaments, cyan tint",
glsl:`void main(){vec2 p=mod(gl_FragCoord.xy/R.y*6.2832,6.2832)-250.;vec2 i=p;float c=1.,inten=.005;
for(int k=0;k<5;k++){float t=T*.5*(1.-(3.5/float(k+1)));i=p+vec2(cos(t-i.x)+sin(t+i.y),sin(t-i.y)+cos(t+i.x));c+=1./length(vec2(p.x/(sin(i.x+t)/inten),p.y/(cos(i.y+t)/inten)));}
c/=5.;c=1.17-pow(c,1.4);vec3 col=vec3(pow(abs(c),8.));gl_FragColor=vec4(clamp(col+vec3(0.,.3,.45),0.,1.),1.);}`},
{id:"pri",cat:"optics",nm:"棱镜色散",en:"Prism dispersion",ds:"白光分解成光谱",use:["P2"],useTxt:"P2 七身色彩的引子",
tech:"等边三角棱镜用 SDF 描边，入射白光是一条发光线段，出射扇面按角度映射到波长色谱。",
prompt:"triangular prism SDF outline, white beam in, spectral fan out, wavelength-to-RGB mapping, animated spread",
glsl:`float tri(vec2 p,float r){const float k=1.7320508;p.x=abs(p.x)-r;p.y=p.y+r/k;if(p.x+k*p.y>0.)p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.;p.x-=clamp(p.x,-2.*r,0.);return -length(p)*sign(p.y);}

const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
function GLR(canvas){
  const g=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
  if(!g)return null;
  const buf=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,buf);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
  const progs={};
  function get(fx){
    if(progs[fx.id]!==undefined)return progs[fx.id];
    const mk=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);return o};
    const pr=g.createProgram();g.attachShader(pr,mk(g.VERTEX_SHADER,VS));g.attachShader(pr,mk(g.FRAGMENT_SHADER,PRE+fx.glsl));g.linkProgram(pr);
    if(!g.getProgramParameter(pr,g.LINK_STATUS)){progs[fx.id]=null;return null}
    progs[fx.id]={pr,a:g.getAttribLocation(pr,'p'),R:g.getUniformLocation(pr,'R'),T:g.getUniformLocation(pr,'T')};
    return progs[fx.id];
  }
  return {canvas,draw(fx,t){const p=get(fx);if(!p)return false;g.viewport(0,0,canvas.width,canvas.height);g.useProgram(p.pr);
    g.bindBuffer(g.ARRAY_BUFFER,buf);g.enableVertexAttribArray(p.a);g.vertexAttribPointer(p.a,2,g.FLOAT,false,0,0);
    g.uniform2f(p.R,canvas.width,canvas.height);g.uniform1f(p.T,t);g.drawArrays(g.TRIANGLES,0,3);return true}};
}

const LZ=[];{let x=.1,y=0,z=0;for(let i=0;i<8000;i++){const dx=10*(y-x),dy=x*(28-z)-y,dz=x*y-8/3*z;x+=dx*.005;y+=dy*.005;z+=dz*.005;LZ.push([x,y,z])}}
function make2D(kind,c,W,H){
  const s=W/320,bg='#07090f';c.fillStyle=bg;c.fillRect(0,0,W,H);
  if(kind==='lor')return t=>{c.fillStyle=bg;c.fillRect(0,0,W,H);const a=t*.3,ca=Math.cos(a),sa=Math.sin(a),k=H/58;
    c.strokeStyle='rgba(237,147,177,.55)';c.lineWidth=.7*s;c.beginPath();
    for(let i=0;i<LZ.length;i++){const p=LZ[i],X=W/2+(p[0]*ca+p[1]*sa)*k,Y=H/2-(p[2]-25)*k;i?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke();
    const hp=LZ[Math.floor(Math.abs(t)*200)%LZ.length];c.fillStyle='#fff';c.beginPath();c.arc(W/2+(hp[0]*ca+hp[1]*sa)*k,H/2-(hp[2]-25)*k,2.5*s,0,7);c.fill()};
  if(kind==='spi')return t=>{c.fillStyle=bg;c.fillRect(0,0,W,H);const R=7,r=3,d=1.5+1.4*Math.sin(t*.4),k=H*.45/(R-r+d);
    c.strokeStyle='rgba(239,159,39,.85)';c.lineWidth=s;c.beginPath();
    for(let i=0;i<=900;i++){const u=i/900*Math.PI*6,X=W/2+k*((R-r)*Math.cos(u+t*.1)+d*Math.cos((R-r)/r*u-t*.1)),Y=H/2+k*((R-r)*Math.sin(u+t*.1)-d*Math.sin((R-r)/r*u-t*.1));i?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke()};
  if(kind==='tes'){const V=[],E=[];for(let i=0;i<16;i++)V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);
    for(let i=0;i<16;i++)for(let j=i+1;j<16;j++){const x=i^j;if(!(x&(x-1)))E.push([i,j])}
    return t=>{c.fillStyle=bg;c.fillRect(0,0,W,H);const a=t*.5,b=t*.3,cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b);
      const P=V.map(([x,y,z,w])=>{let X=x*cA-w*sA,Wv=x*sA+w*cA,Y=y*cB-z*sB,Z=y*sB+z*cB;const k=1/(2.6-Wv);X*=k;Y*=k;Z*=k;const k2=1/(3-Z);return[W/2+X*k2*H*.95,H/2+Y*k2*H*.95,Wv]});
      c.lineWidth=1.2*s;E.forEach(([i,j])=>{const w=(P[i][2]+P[j][2])/2;c.strokeStyle=w>0?'rgba(239,159,39,.9)':'rgba(133,183,235,.85)';c.beginPath();c.moveTo(P[i][0],P[i][1]);c.lineTo(P[j][0],P[j][1]);c.stroke()});
      c.fillStyle='#fff';P.forEach(p=>{c.beginPath();c.arc(p[0],p[1],2*s,0,7);c.fill()})}}
  const N=Math.min(6000,Math.round(900*W*H/(320*200))),ps=Array.from({length:N},()=>[Math.random()*W,Math.random()*H]);
  let last=null;
  return t=>{const dt=last===null?1:Math.max(0,Math.min(3,(t-last)*60));last=t;
    c.fillStyle='rgba(7,9,15,.08)';c.fillRect(0,0,W,H);c.fillStyle='rgba(93,202,165,.9)';
    for(const p of ps){const a=(Math.sin(p[0]*.008/s+t*.3)+Math.cos(p[1]*.01/s-t*.2))*Math.PI;p[0]+=Math.cos(a)*s*dt;p[1]+=Math.sin(a)*s*dt;
      if(p[0]<0||p[0]>W||p[1]<0||p[1]>H||Math.random()<.004){p[0]=Math.random()*W;p[1]=Math.random()*H}c.fillRect(p[0],p[1],s,s)}}
}

const cards=[];
CATS.forEach(([cat,label,en])=>{
  const list=FX.filter(f=>f.cat===cat);
  const sec=document.createElement('section');sec.className='sec';sec.dataset.cat=cat;
  sec.innerHTML='<h2>'+label+' <span>'+en+'</span></h2><div class="grid"></div>';
  main.appendChild(sec);const grid=sec.querySelector('.grid');
  list.forEach(fx=>{
    const b=document.createElement('button');b.className='card';b.type='button';b.dataset.use=fx.use.join(' ');
    b.setAttribute('aria-label',fx.nm+'，打开预览');
    b.innerHTML='<canvas width="320" height="200"></canvas><div class="meta"><div class="nm"><span>'+fx.nm+'</span><span class="id">#'+fx.id+'</span></div><div class="ds">'+fx.ds+'</div><div class="tags">'+fx.use.map(u=>'<span class="tag">'+(u==='bg'?'背景':u)+'</span>').join('')+'</div></div>';
    grid.appendChild(b);
    const cv=b.querySelector('canvas'),ctx=cv.getContext('2d');
    const o={fx,el:b,ctx,vis:false,f2d:fx.js?make2D(fx.js,ctx,320,200):null};
    cards.push(o);
    b.addEventListener('click',()=>{location.hash=fx.id});
  });
});
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{const o=cards.find(c=>c.el===e.target);if(o)o.vis=e.isIntersecting}),{rootMargin:'100px'});cards.forEach(o=>io.observe(o.el))}else cards.forEach(o=>o.vis=true);

function drawCard(o,t){if(o.f2d){o.f2d(t);return}if(cardGL&&cardGL.draw(o.fx,t))o.ctx.drawImage(offGL,0,0)}
cards.forEach(o=>drawCard(o,2));

let useFilter='all';
function applyFilter(){let n=0;cards.forEach(o=>{const show=useFilter==='all'||o.fx.use.includes(useFilter);o.el.style.display=show?'':'none';if(show)n++});
  document.querySelectorAll('.sec').forEach(s=>{s.style.display=[...s.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none'});
  document.getElementById('count').textContent=n+' / '+FX.length+' 个效果'}
document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{useFilter=ch.dataset.use;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===ch?'true':'false'));applyFilter()}));
applyFilter();

const viewer=document.getElementById('viewer'),vgl=document.getElementById('vgl'),v2d=document.getElementById('v2d');
const viewGL=GLR(vgl);let cur=null,curF2d=null,vt=0,speed=1,playing=!reduce,lastFrame=null,lastFocus=null;
const $=id=>document.getElementById(id);
function openFx(fx){cur=fx;vt=2;lastFocus=document.activeElement;
  $('vname').textContent=fx.nm;$('ven').textContent=fx.en;$('vid').textContent='#'+fx.id;$('vtech').textContent=fx.tech;$('vuse').textContent=fx.useTxt;$('vprompt').textContent=fx.prompt;$('vsrc').textContent=fullSrc(fx);$('toast').textContent='';
  if(fx.js){vgl.style.display='none';v2d.style.display='block';curF2d=make2D(fx.js,v2d.getContext('2d'),960,600)}else{v2d.style.display='none';vgl.style.display='block';curF2d=null}
  viewer.classList.add('open');document.body.style.overflow='hidden';$('vplay').textContent=playing?'暂停':'播放';renderView();$('vclose').focus()}
function closeFx(){viewer.classList.remove('open');document.body.style.overflow='';cur=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search);if(lastFocus)lastFocus.focus()}
function renderView(){if(!cur)return;if(curF2d)curF2d(vt);else if(viewGL)viewGL.draw(cur,vt)}
function route(){const id=location.hash.slice(1);const fx=FX.find(f=>f.id===id);if(fx)openFx(fx);else if(cur)closeFx()}
window.addEventListener('hashchange',route);
$('vclose').addEventListener('click',closeFx);
viewer.addEventListener('click',e=>{if(e.target===viewer)closeFx()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeFx()});
$('vplay').addEventListener('click',()=>{playing=!playing;$('vplay').textContent=playing?'暂停':'播放'});
$('vspeed').addEventListener('input',e=>{speed=+e.target.value;$('vspeedv').textContent=speed.toFixed(1)+'×'});
function copy(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{$('toast').textContent='已复制'},()=>{$('toast').textContent='复制被浏览器拒绝，可手动选中复制'})}else $('toast').textContent='复制被浏览器拒绝，可手动选中复制'}
$('cpPrompt').addEventListener('click',()=>copy(cur?cur.prompt:''));
$('cpSrc').addEventListener('click',()=>copy(cur?fullSrc(cur):''));

const t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  if(!reduce&&!cur)cards.forEach(o=>{if(o.vis&&o.el.style.display!=='none')drawCard(o,t)});
  if(cur&&playing){const dt=lastFrame===null?0:(now-lastFrame)/1000;vt+=dt*speed;renderView()}
  lastFrame=now;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
route();
</script>
</body>
</html>
